- uri: template://kro-provisioners/route
  type: route
  description: FIXME.
  supported_params:
    - host
    - port
    - path

- uri: template://kro-provisioners/dns
  type: dns
  description: Outputs a *.localhost domain as the hostname.
  init: |
    randomHostname: dns{{ randAlphaNum 6 | lower }}.localhost
  state: |
    instanceHostname: {{ dig "instanceHostname" .Init.randomHostname .State | quote }}
  outputs: |
    host: {{ .State.instanceHostname }}
  expected_outputs:
    - host

- uri: template://kro-provisioners/hpa
  type: horizontal-pod-autoscaler
  description: FIXME.
  supported_params:
    - maxReplicas
    - minReplicas
    - targetCPUUtilizationPercentage
    - targetMemoryUtilizationPercentage

- uri: template://kro-provisioners/redis
  type: redis
  description: FIXME.
  outputs: |
    host: {{ encodeSecretRef (printf "%s-redis-outputs" .SourceWorkload) "host" }}
    port: {{ encodeSecretRef (printf "%s-redis-outputs" .SourceWorkload) "port" }}
    username: {{ encodeSecretRef (printf "%s-redis-outputs" .SourceWorkload) "username" }}
    password: {{ encodeSecretRef (printf "%s-redis-outputs" .SourceWorkload) "password" }}
  expected_outputs:
    - host
    - port
    - username
    - password