apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: workload-app
spec:
  schema:
    apiVersion: v1alpha1
    kind: Workload
    spec:
      name:            string  | required=true
      replicas:        integer | default=2 minimum=1 maximum=50
      image:           string  | required=true
      imagePullPolicy: string  | default="IfNotPresent"

      command: "[]string"
      args: "[]string"

      env: "[]envVar"

      livenessProbe:
        httpGet: httpProbe
        command: execProbe
        initialDelaySeconds: integer | default=3
        periodSeconds: integer | default=10
        timeoutSeconds: integer | default=5
        failureThreshold: integer | default=3
      
      readinessProbe:
        httpGet: httpProbe
        command: execProbe
        initialDelaySeconds: integer | default=3
        periodSeconds: integer | default=10
        timeoutSeconds: integer | default=5
        failureThreshold: integer | default=3
      
      service:
        ports: "[]port | required"

      # Ports (scalars) --> we'll find another way later
      httpPort:        integer | default=9898 minimum=1 maximum=65535
      grpcPort:        integer | default=9999 minimum=1 maximum=65535

      # Optional HTTPRoute (boolean + strings)
      createHTTPRoute: boolean | default=false
      hostname:        string  | required=false
      routePath:       string  | default="/"
      gatewayName:     string  | default="default"

      # --- Security & resources knobs ---
      automountSAToken:           boolean | default=false
      readOnlyRootFilesystem:     boolean | default=true
      allowPrivilegeEscalation:   boolean | default=false
      runAsUser:                  integer | default=65532 minimum=1000
      runAsGroup:                 integer | default=65532 minimum=1000
      fsGroup:                    integer | default=65532 minimum=1

      resources:
        limits:
          memory: string | default="512Mi"
          cpu: string | default="500m"
        requests:
          memory: string | default="128Mi"
          cpu: string | default="100m"

      # HPA (autoscaling/v2)
      enableHPA:                  boolean | default=true
      minReplicas:                integer | default=2 minimum=1
      maxReplicas:                integer | default=10 minimum=1
      targetCPUUtilization:       integer | default=70 minimum=1 maximum=100
      targetMemoryUtilization:    integer | default=80 minimum=1 maximum=100

      # Optional add-ons
      enableNetworkPolicy:        boolean | default=true
      enablePDB:                  boolean | default=true
      pdbMinAvailable:            string  | default="50%"

    types:
      port:
        name: string
        port: integer | required=true minimum=1 maximum=65535
        protocol: string | enum="TCP,UDP" default="TCP"
        targetPort: integer | minimum=1 maximum=65535
      envVar:
        name: string
        value: string
      httpProbe:
        port: integer | required=true minimum=1 maximum=65535
        path: string | required=true
        scheme: string | enum="HTTP,HTTPS" default="HTTP"
      execProbe:
        command: "[]string"

  resources:
    - id: service
      includeWhen:
        - ${has(schema.spec.service)}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}
        spec:
          selector:
            app.kubernetes.io/name: ${schema.spec.name}
          ports: ${schema.spec.service.ports}
    - id: serviceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}-sa
        automountServiceAccountToken: ${schema.spec.automountSAToken}
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}
          labels:
            app.kubernetes.io/name: ${schema.spec.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 25%
              maxUnavailable: 1
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: ${string(schema.spec.httpPort)}
            spec:
              serviceAccountName: ${serviceAccount.metadata.name}
              automountServiceAccountToken: ${schema.spec.automountSAToken}
              securityContext:
                runAsNonRoot: true
                runAsUser: ${schema.spec.runAsUser}
                runAsGroup: ${schema.spec.runAsGroup}
                fsGroup: ${schema.spec.fsGroup}
                seccompProfile:
                  type: RuntimeDefault
              volumes:
                - name: data
                  emptyDir: {}
              containers:
                - name: podinfo
                  image: ${schema.spec.image}
                  imagePullPolicy: ${schema.spec.imagePullPolicy}
                  securityContext:
                    allowPrivilegeEscalation: ${schema.spec.allowPrivilegeEscalation}
                    readOnlyRootFilesystem: ${schema.spec.readOnlyRootFilesystem}
                    capabilities:
                      drop: ["ALL"]
                  command: ${schema.spec.command}
                  args: ${schema.spec.args}
                  env: ${schema.spec.env}
                  resources: ${schema.spec.resources}
                  volumeMounts:
                    - name: data
                      mountPath: /data
                  livenessProbe: ${schema.spec.livenessProbe}
                  readinessProbe: ${schema.spec.readinessProbe}
    - id: hpa
      includeWhen:
        - ${schema.spec.enableHPA}
      template:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: ${schema.spec.name}
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: ${deployment.metadata.name}
          minReplicas: ${schema.spec.minReplicas}
          maxReplicas: ${schema.spec.maxReplicas}
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: ${schema.spec.targetCPUUtilization}
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: ${schema.spec.targetMemoryUtilization}
    - id: netpol
      includeWhen:
        - ${schema.spec.enableNetworkPolicy}
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.spec.name}-default-deny-ingress
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}
          policyTypes: ["Ingress","Egress"]
          ingress:
            - from:
                - podSelector: {}   # adjust as needed
              ports:
                - protocol: TCP
                  port: ${schema.spec.httpPort}
          egress:
            - {}  # allow all egress by default
    - id: pdb
      includeWhen:
        - ${schema.spec.enablePDB}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${schema.spec.name}
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}
          minAvailable: ${schema.spec.pdbMinAvailable}
    - id: httpRoute
      includeWhen:
        - ${schema.spec.createHTTPRoute}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name:      ${schema.spec.name}
        spec:
          hostnames:
            - ${schema.spec.hostname}
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${schema.spec.gatewayName}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${schema.spec.routePath}
              backendRefs:
                - name: ${service.metadata.name}
                  port: ${schema.spec.httpPort}
