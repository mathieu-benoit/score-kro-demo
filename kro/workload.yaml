apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: workload
spec:
  schema:
    apiVersion: v1alpha1
    kind: Workload
    spec:
      replicas: integer | default=1 minimum=1 maximum=50
      image: string | required=true
      imagePullPolicy: string | default="IfNotPresent"

      command: "[]string | default=[]"
      args: "[]string | default=[]"

      env: "[]envVar | default=[]"

      livenessProbe: containerProbe | required=true

      readinessProbe: containerProbe | required=true

      service:
        ports: "[]port | required"

      resources:
        limits:
          memory: string | default="512Mi"
          cpu: string | default="500m"
        requests:
          memory: string | default="128Mi"
          cpu: string | default="100m"

      hpa:
        minReplicas: integer | minimum=1
        maxReplicas: integer | minimum=1
        targetCPUUtilization: integer | default=50 minimum=1 maximum=100
        targetMemoryUtilization: integer | default=50 minimum=1 maximum=100

      route:
        host: string | required=true
        path: string | default="/"
        port: integer | required=true minimum=1 maximum=65535
        gatewayName: string | default="default"
        gatewayNamespace: string | default="default"

      # Optional add-ons
      enableNetworkPolicy: boolean | default=true
      enablePDB: boolean | default=true
      pdbMinAvailable: string | default="50%"

      prometheusPort: integer | default=9898 minimum=1 maximum=65535

      automountSAToken: boolean | default=false
      readOnlyRootFilesystem: boolean | default=true
      allowPrivilegeEscalation: boolean | default=false
      runAsUser: integer | default=65532 minimum=1000
      runAsGroup: integer | default=65532 minimum=1000
      fsGroup: integer | default=65532 minimum=1

      rbacRules: "[]rbacRule"

      inClusterRedis: boolean | default=false
      memorystoreRedis: boolean | default=false

    types:
      port:
        name: string
        port: integer | required=true minimum=1 maximum=65535
        protocol: string | enum="TCP,UDP" default="TCP"
        targetPort: integer | minimum=1 maximum=65535
      envVar:
        name: string | required=true
        value: string
        valueFrom:
          secretKeyRef:
            name: string
            key: string
      containerProbe:
        httpGet:
          port: integer | required=true minimum=1 maximum=65535
          path: string | required=true
          scheme: string | enum="HTTP,HTTPS"
        exec:
          command: "[]string"
        initialDelaySeconds: integer
        periodSeconds: integer
        timeoutSeconds: integer
        failureThreshold: integer
      rbacRule:
        apiGroups: "[]string"
        resources: "[]string"
        verbs: "[]string"

  resources:
    - id: service
      includeWhen:
        - ${has(schema.spec.service)}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
        spec:
          selector:
            app.kubernetes.io/name: ${schema.metadata.name}
          ports: ${schema.spec.service.ports}

    - id: role
      includeWhen:
        - ${has(schema.spec.rbacRules)}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
        rules: ${schema.spec.rbacRules}

    - id: roleBinding
      includeWhen:
        - ${has(schema.spec.rbacRules)}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        subjects:
        - kind: ServiceAccount
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: ${role.metadata.name}

    - id: serviceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}
        automountServiceAccountToken: ${schema.spec.automountSAToken}

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 25%
              maxUnavailable: 1
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.metadata.name}
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: ${string(schema.spec.prometheusPort)}
            spec:
              serviceAccountName: ${serviceAccount.metadata.name}
              automountServiceAccountToken: ${schema.spec.automountSAToken}
              securityContext:
                runAsNonRoot: true
                runAsUser: ${schema.spec.runAsUser}
                runAsGroup: ${schema.spec.runAsGroup}
                fsGroup: ${schema.spec.fsGroup}
                seccompProfile:
                  type: RuntimeDefault
              volumes:
                - name: data
                  emptyDir: {}
              containers:
                - name: ${schema.metadata.name}
                  image: ${schema.spec.image}
                  imagePullPolicy: ${schema.spec.imagePullPolicy}
                  securityContext:
                    allowPrivilegeEscalation: ${schema.spec.allowPrivilegeEscalation}
                    readOnlyRootFilesystem: ${schema.spec.readOnlyRootFilesystem}
                    capabilities:
                      drop: ["ALL"]
                  command: ${schema.spec.command}
                  args: ${schema.spec.args}
                  env: ${schema.spec.env}
                  resources: ${schema.spec.resources}
                  volumeMounts:
                    - name: data
                      mountPath: /data
                  livenessProbe: ${schema.spec.livenessProbe}
                  readinessProbe: ${schema.spec.readinessProbe}

    - id: hpa
      includeWhen:
        - ${has(schema.spec.hpa)}
      template:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: ${schema.metadata.name}
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: ${deployment.metadata.name}
          minReplicas: ${schema.spec.hpa.minReplicas}
          maxReplicas: ${schema.spec.hpa.maxReplicas}
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: ${schema.spec.hpa.targetCPUUtilization}
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: ${schema.spec.hpa.targetMemoryUtilization}

    - id: netpol
      includeWhen:
        - ${schema.spec.enableNetworkPolicy}
        - ${has(schema.spec.route)}
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.metadata.name}-default-deny-ingress
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
          policyTypes: ["Ingress","Egress"]
          ingress:
            - from:
                - podSelector: {}
              ports:
                - protocol: TCP
                  port: ${schema.spec.route.port}
          egress:
            - {}

    - id: pdb
      includeWhen:
        - ${schema.spec.enablePDB}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${schema.metadata.name}
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}
          minAvailable: ${schema.spec.pdbMinAvailable}

    - id: httpRoute
      includeWhen:
        - ${has(schema.spec.route)}
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${schema.metadata.name}
        spec:
          hostnames:
            - ${schema.spec.route.host}
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: ${schema.spec.route.gatewayName}
              namespace: ${schema.spec.route.gatewayNamespace}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${schema.spec.route.path}
              backendRefs:
                - name: ${service.metadata.name}
                  port: ${schema.spec.route.port}

    - id: redisConfig
      includeWhen:
        - ${schema.spec.inClusterRedis}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-redis
        data:
          redis.conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
            save ""
            appendonly no

    - id: redisService
      includeWhen:
        - ${schema.spec.inClusterRedis}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-redis
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}-redis
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: ${schema.metadata.name}-redis
          ports:
            - name: redis
              port: 6379
              protocol: TCP
              targetPort: redis

    - id: redisDeployment
      includeWhen:
        - ${schema.spec.inClusterRedis}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}-redis
          labels:
            app.kubernetes.io/name: ${schema.metadata.name}-redis
        spec:
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.metadata.name}-redis
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.metadata.name}-redis
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: redis
                  image: "redis:7.4-alpine"
                  imagePullPolicy: IfNotPresent
                  command:
                    - redis-server
                    - "/redis-master/redis.conf"
                  ports:
                    - name: redis
                      containerPort: 6379
                      protocol: TCP
                  livenessProbe:
                    tcpSocket:
                      port: redis
                    initialDelaySeconds: 5
                    timeoutSeconds: 5
                  readinessProbe:
                    exec:
                      command:
                        - redis-cli
                        - ping
                    initialDelaySeconds: 5
                    timeoutSeconds: 5
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "32Mi"
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/redis
                    - name: config
                      mountPath: /redis-master
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: ["ALL"]
              volumes:
                - name: data
                  emptyDir: {}
                - name: config
                  configMap:
                    name: ${schema.metadata.name}-redis
                    items:
                      - key: redis.conf
                        path: redis.conf

    - id: redisOutputsSecrets
      includeWhen:
        - ${schema.spec.inClusterRedis}
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.metadata.name}-redis-outputs
        stringData:
          host: ${schema.metadata.name}-redis
          port: "6379"
          username: "default"
          password: "default"

    - id: memorystore
      includeWhen:
        - ${schema.spec.memorystoreRedis}
      template:
        apiVersion: redis.cnrm.cloud.google.com/v1beta1
        kind: RedisInstance
        metadata:
          name: ${schema.metadata.name}-redis
        spec:
          redisVersion: REDIS_7_2
          region: us-central1
          tier: BASIC
          memorySizeGb: 16
          authEnabled: true

    - id: memorystoreOutputsSecrets
      includeWhen:
        - ${schema.spec.memorystoreRedis}
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.metadata.name}-memorystore-outputs
        stringData:
          host: ${memorystore.status.host}
          port: ${memorystore.status.port}
          username: "default"
          password: ${memorystore.status.observedState.authString}
